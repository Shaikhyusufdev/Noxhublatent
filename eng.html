<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOX STREAM PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.15.0/shaka-player.compiled.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.player {
  width: 100%;
  max-width: 1100px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 20px 80px #000;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: #e50914;
}

.badge {
  color: #bbb;
  font-size: 11px;
  border: 1px solid #333;
  padding: 7px 10px;
  border-radius: 20px;
}

.screen {
  position: relative;
  background: #000;
  aspect-ratio: 16 / 9;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: #0003;
}

.overlay.hidden {
  display: none;
}

  width: 72px;
  height: 72px;
  border: none;
  border-radius: 50%;

  cursor: pointer;
}

.info {

}

.info.error {
  color: #ff6b6b;
}

  padding: 0 18px;
}

  width: 100%;

}

  display: flex;

}

  padding: 10px 12px;
  background: #222;
  color: white;
  border: 1px solid #383838;
  border-radius: 7px;
  cursor: pointer;
}

  background: #333;

  accent-color: #e50914;

</style>
</head>

<body>

<div class="player">

  <header class="header">
    <div class="logo">NOX<span>STREAM</span></div>
    <div class="badge" id="status">INITIALIZING</div>
  </header>

  <div class="screen" id="screen">
    <video id="video" playsinline preload="metadata"></video>

    <div class="overlay" id="overlay">
      <button class="big-play" id="bigPlay">▶</button>
    </div>
  </div>

  <div class="info" id="info">
    Initializing player...
  </div>

  <div class="progress">
    <input id="seek" type="range"
           min="0" max="100" value="0">
  </div>

  <div class="controls">
    <button id="play">▶ Play</button>

    <span class="time" id="time">00:00 / LIVE</span>

    <button id="mute">🔊</button>

    <input id="volume" type="range"
           min="0" max="1" step="0.05" value="1">

    <select id="quality">
      <option value="auto">Auto Quality</option>
    </select>

    <button id="fullscreen">⛶ Fullscreen</button>
  </div>

  <footer class="footer">
    NOX STREAM PRO · DASH PLAYER
  </footer>

</div>

<script>
"use strict";

// Updated Sony Six SD DASH manifest
const STREAM_URL =
  "https://jiotvmblive.cdn.jio.com/bpk-tv/Sony_Six_SD_MOB/WDVLive/index.mpd";

// Keep private authentication credentials on your authorized server.
// Configure the server's supported authentication method there.

const video = document.getElementById("video");
const status = document.getElementById("status");
const info = document.getElementById("info");
const overlay = document.getElementById("overlay");
const playButton = document.getElementById("play");
const seek = document.getElementById("seek");
const time = document.getElementById("time");
const volume = document.getElementById("volume");
const mute = document.getElementById("mute");
const quality = document.getElementById("quality");

let player = null;
let isSeeking = false;

function setMessage(text, error = false) {
  info.textContent = text;
  info.className = error ? "info error" : "info";
}

function formatTime(value) {
  if (!Number.isFinite(value) || value < 0) return "LIVE";

  const hours = Math.floor(value / 3600);
  const minutes = Math.floor((value % 3600) / 60);
  const seconds = Math.floor(value % 60);

  const mm = String(minutes).padStart(2, "0");
  const ss = String(seconds).padStart(2, "0");

  return hours
    ? `${String(hours).padStart(2, "0")}:${mm}:${ss}`
    : `${mm}:${ss}`;
}

async function initializePlayer() {
  if (!window.shaka) {
    status.textContent = "ENGINE ERROR";
    setMessage("Unable to load Shaka Player. Check your internet connection.", true);
    return;
  }

  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    status.textContent = "UNSUPPORTED";
    setMessage("This browser does not support the player.", true);
    return;
  }

  try {
    player = new shaka.Player();
    await player.attach(video);

    player.addEventListener("error", event => {
      const error = event.detail;

      console.error("Shaka error:", error);

      status.textContent = "PLAYBACK ERROR";

      setMessage(
        `Error ${error.code}: ${error.message || "Playback failed"}. Check the manifest URL, authentication, CORS and server response.`,
        true
      );
    });

    status.textContent = "LOADING";
    setMessage("Loading Sony Six SD stream...");

    await player.load(STREAM_URL);

    status.textContent = "READY";
    setMessage("Stream loaded. Press Play to start.");

    populateQualities();

  } catch (error) {
    console.error("Stream loading failed:", error);

    status.textContent = "LOAD FAILED";

    setMessage(
      `Unable to load stream. ${error.message || "Check URL, authentication and server permissions."}`,
      true
    );
  }
}

function populateQualities() {
  quality.replaceChildren();

  const autoOption = document.createElement("option");
  autoOption.value = "auto";
  autoOption.textContent = "Auto Quality";
  quality.appendChild(autoOption);

  const seen = new Set();

  player.getVariantTracks().forEach(track => {
    if (!track.height) return;

    const label = `${track.height}p`;

    if (seen.has(label)) return;
    seen.add(label);

    const option = document.createElement("option");
    option.value = String(track.id);
    option.textContent = label;

    quality.appendChild(option);
  });
}

async function togglePlayback() {
  if (video.paused) {
    try {
      await video.play();
    } catch (error) {
      setMessage(
        "Playback failed. Check stream access and try again.",
        true
      );
    }
  } else {
    video.pause();
  }
}

document.getElementById("bigPlay")
  .addEventListener("click", togglePlayback);

playButton.addEventListener("click", togglePlayback);

video.addEventListener("playing", () => {
  status.textContent = "PLAYING";
  setMessage("Stream is playing.");
  overlay.classList.add("hidden");
  playButton.textContent = "❚❚ Pause";
});

video.addEventListener("pause", () => {
  overlay.classList.remove("hidden");
  playButton.textContent = "▶ Play";
});

video.addEventListener("waiting", () => {
  status.textContent = "BUFFERING";
});

video.addEventListener("timeupdate", () => {
  if (!isSeeking) {
    if (Number.isFinite(video.duration) && video.duration > 0) {
      seek.value = (video.currentTime / video.duration) * 100;
    }

    time.textContent =
      `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  }
});

seek.addEventListener("input", () => {
  isSeeking = true;
});

seek.addEventListener("change", () => {
  if (Number.isFinite(video.duration) && video.duration > 0) {
    video.currentTime =
      (Number(seek.value) / 100) * video.duration;
  }

  isSeeking = false;
});

volume.addEventListener("input", () => {
  video.volume = Number(volume.value);
  video.muted = video.volume === 0;
  mute.textContent = video.muted ? "🔇" : "🔊";
});

mute.addEventListener("click", () => {
  video.muted = !video.muted;
  mute.textContent = video.muted ? "🔇" : "🔊";
});

quality.addEventListener("change", () => {
  if (!player) return;

  if (quality.value === "auto") {
    player.configure({ abr: { enabled: true } });
    return;
  }

  const track = player.getVariantTracks().find(
    item => item.id === Number(quality.value)
  );

  if (track) {
    player.configure({ abr: { enabled: false } });
    player.selectVariantTrack(track, true);
  }
});

document.getElementById("fullscreen").addEventListener("click", async () => {
  const screen = document.getElementById("screen");

  try {
    if (!document.fullscreenElement) {
      await screen.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    setMessage("Fullscreen is not available.", true);
  }
});

initializePlayer();
</script>

</body>
</html>
