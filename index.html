<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nox4clip — Screening Room</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="marquee">
    <h1 class="brand" aria-label="NoxHub">
      <svg class="brand-crown" viewBox="0 0 64 48" aria-hidden="true">
        <path d="M6 42 L2 12 L18 25 L32 4 L46 25 L62 12 L58 42 Z" />
        <circle cx="2" cy="11" r="3.2" />
        <circle cx="32" cy="3.5" r="3.2" />
        <circle cx="62" cy="11" r="3.2" />
      </svg>
      <span class="brand-text"><span class="brand-nox">Nox</span><span class="brand-hub">Hub</span></span>
    </h1>
    <p class="tagline">Premium Show Latent</p>
  </header>

  <main id="rows">
    <!-- rows are rendered here by js/app.js -->
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-tagline"><span class="footer-heart">&#10084;</span> Support NoxHub</p>
      <div class="footer-links">
        <a class="footer-link footer-instagram" id="footerInstagram" href="#" target="_blank" rel="noopener">
          <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
          <span>Instagram</span>
        </a>
        <a class="footer-link footer-telegram" id="footerTelegram" href="#" target="_blank" rel="noopener">
          <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.9 4.3 2.6 11.9c-1 .4-1 1 .1 1.4l4.9 1.5 1.9 6.2c.2.6.4.8.8.8s.6-.2.9-.5l2.3-2.2 4.7 3.5c.8.6 1.4.3 1.6-.7l3-14.4c.3-1.2-.4-1.7-1.4-1.2Z"/>
          </svg>
          <span>Telegram</span>
        </a>
      </div>
    </div>
  </footer>

  <style>
    .site-footer {
      margin-top: 56px;
      padding: 40px 24px 48px;
      text-align: center;
      animation: footerFadeUp 0.7s ease both;
    }
    @keyframes footerFadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .footer-inner::before {
      content: '';
      display: block;
      width: 120px;
      height: 1px;
      margin: 0 auto 28px;
      background: linear-gradient(90deg, transparent, rgba(230, 190, 120, 0.55), transparent);
    }
    .footer-tagline {
      margin: 0 0 18px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.55);
    }
    .footer-heart {
      display: inline-block;
      color: #e63946;
      margin-right: 6px;
      animation: footerHeartBeat 1.6s ease-in-out infinite;
    }
    @keyframes footerHeartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #eee;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
    }
    .footer-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .footer-link:hover, .footer-link:focus-visible { transform: translateY(-3px); }
    .footer-link:active { transform: translateY(-1px) scale(0.97); }
    .footer-instagram:hover {
      border-color: transparent;
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af, #515bd4);
      box-shadow: 0 8px 24px rgba(221, 42, 123, 0.35);
    }
    .footer-telegram:hover {
      border-color: rgba(41, 182, 246, 0.6);
      background: rgba(41, 182, 246, 0.12);
      color: #29b6f6;
      box-shadow: 0 8px 24px rgba(41, 182, 246, 0.25);
    }
  </style>

  <div class="player-overlay" id="playerOverlay">
    <div class="player-box">
      <div class="player-stage" id="playerStage">
       <div class="player-inner">
        <video id="playerVideo" playsinline preload="auto"></video>

        <div class="buffer-spinner" id="bufferSpinner" aria-label="Buffering"></div>
        <div class="buffer-text" id="bufferText"></div>
        <div class="player-toast" id="playerToast"></div>

        <!-- 5s skip buttons, always on the video itself (left / right) -->
        <button class="side-skip side-skip-left" id="back5Btn" aria-label="Back 5 seconds">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          <span>5</span>
        </button>
        <button class="side-skip side-skip-right" id="fwd5Btn" aria-label="Forward 5 seconds">
          <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg>
          <span>5</span>
        </button>

        <div class="player-controls" id="playerControls">
          <!-- progress bar is display-only: users cannot drag/click to jump -->
          <div class="progress" id="progress">
            <div class="progress-buffered" id="progressBuffered"></div>
            <div class="progress-played" id="progressPlayed"></div>
          </div>

          <div class="controls-row">
            <button class="ctl-btn" id="playPauseBtn" aria-label="Play / Pause">
              <svg viewBox="0 0 24 24" class="ico-play"><path d="M8 5v14l11-7z"/></svg>
              <svg viewBox="0 0 24 24" class="ico-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>

            <span class="time-label" id="timeLabel">0:00 / 0:00</span>
            <span class="ctl-spacer"></span>

            <div class="quality-wrap" id="qualityWrap" hidden>
              <button class="ctl-btn ctl-quality" id="qualityBtn" aria-label="Video quality">
                <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4L10.7 6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
                <span id="qualityLabel">Auto</span>
              </button>
              <div class="quality-menu" id="qualityMenu" hidden></div>
            </div>

            <button class="ctl-btn" id="muteBtn" aria-label="Mute / Unmute">
              <svg viewBox="0 0 24 24" class="ico-vol"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
              <svg viewBox="0 0 24 24" class="ico-muted"><path d="M3 9v6h4l5 5V4L7 9H3zm12.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
            </button>

            <button class="ctl-btn" id="fsBtn" aria-label="Fullscreen / landscape">
              <svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/></svg>
            </button>
          </div>
        </div>
       </div>
      </div>
      <div class="player-info">
        <div>
          <h3 id="playerTitle"></h3>
          <p id="playerDescription"></p>
        </div>
        <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
      </div>
    </div>
  </div>

  <div class="choice-overlay" id="choiceOverlay">
    <div class="choice-box">
      <h3 id="choiceTitle"></h3>
      <p class="choice-sub">How would you like to watch this?</p>
      <div class="choice-buttons">
        <button id="streamChoiceBtn" class="choice-btn stream-btn">
          <span class="btn-icon">&#9654;</span>
          <span>Stream</span>
        </button>
        <button id="downloadChoiceBtn" class="choice-btn download-btn">
          <span class="btn-icon">&#8595;</span>
          <span>Download</span>
        </button>
      </div>
      <button class="choice-cancel" id="choiceCancelBtn">Cancel</button>
    </div>
  </div>

  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-box">
      <p class="countdown-label">Please wait</p>
      <div class="countdown-number" id="countdownNumber">5</div>
      <div class="countdown-bar"><div class="countdown-bar-fill" id="countdownBarFill"></div></div>
    </div>
  </div>

  <div class="support-overlay" id="supportOverlay">
    <div class="support-box">
      <h3>Enjoying nox4clip?</h3>
      <p id="supportMsg">Support us and join our Telegram channel for updates and requests.</p>
      <a id="supportJoinBtn" class="support-join-btn" href="#" target="_blank" rel="noopener">Join Telegram</a>
      <button class="support-continue-btn" id="supportContinueBtn" hidden>I've joined, continue watching</button>
      <button class="support-close-btn" id="supportCloseBtn">Maybe later</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
